name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the information below.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - agent-governance-toolkit-core
        - agent-primitives
        - agent-os
        - agent-mesh
        - agent-runtime
        - agent-sre
        - agent-compliance
        - agent-mcp-governance
        - agent-rag-governance
        - agent-sandbox
        - agent-discovery
        - agt-policies
        - agent-hypervisor
        - agent-lightning
        - agent-marketplace
        - agent-governance-toolkit-cli
        - agent-governance-toolkit-integrations
        - agent-governance-toolkit-protocols
        - agentmesh-integrations
        - policy-engine
        - schemas
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: How does this impact your work?
      description: |
        What were you trying to do when you hit this, and how is the bug affecting
        you (e.g. fully blocked, workaround available, degraded behavior)? This
        helps us prioritize.
  - type: input
    id: timeline
    attributes:
      label: Timeline
      description: If this is time-sensitive, when do you need a fix by? Leave blank if there is no specific deadline.
      placeholder: e.g. by 2026-09-30, blocking a release, or no hard deadline
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Microsoft Open Source Code of Conduct
          required: true
