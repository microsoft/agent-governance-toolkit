version: 2
# Every ecosystem sets commit-message.prefix so Dependabot emits titles in the
# repo's conventional-commit shape. Dependabot still controls the generated
# "Bump"/"Update" subject, so pr-title-check.yml validates that bot-authored
# form separately while preserving the lowercase rule for contributor PRs.
updates:
  # All Python packages under agent-governance-python/, covered by a single
  # multi-directory entry. A separate per-directory entry for any of these
  # dirs would be a duplicate ecosystem+directory config and invalidate the
  # whole file, so they are intentionally consolidated here.
  #
  # The python-dev-tooling group (mypy, pytest, structlog, ruff) is grouped
  # across all directories: the docker-compose-test image installs every
  # package's [dev] extras into a single pip environment, so bumping one
  # package's dev-tool floor past another's cap makes the resolver unsolvable
  # (see issue #2930). Grouping lands those bumps as one PR. Every other
  # dependency still gets its own individual PR per directory.
  - package-ecosystem: "pip"
    directories:
      - "/agent-governance-python/agent-os"
      - "/agent-governance-python/agent-mesh"
      - "/agent-governance-python/agent-hypervisor"
      - "/agent-governance-python/agent-sre"
      - "/agent-governance-python/agent-compliance"
      - "/agent-governance-python/agent-discovery"
      - "/agent-governance-python/agent-lightning"
      - "/agent-governance-python/agent-marketplace"
      - "/agent-governance-python/agent-mcp-governance"
      - "/agent-governance-python/agent-primitives"
      - "/agent-governance-python/agent-rag-governance"
      - "/agent-governance-python/agent-runtime"
      - "/agent-governance-python/agent-sandbox"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-dev-tooling:
        patterns:
          - "mypy"
          - "pytest*"
          - "structlog"
          - "ruff"

  # npm packages share one multi-directory entry so the PR limit applies to the
  # JavaScript workspace as a whole instead of multiplying across six entries.
  # Related development tools move together, while other compatible patch and
  # minor updates are grouped by dependency name across directories.
  - package-ecosystem: "npm"
    directories:
      - "/agent-governance-python/agent-os/extensions/mcp-server"
      - "/agent-governance-python/agent-os/extensions/copilot"
      - "/agent-governance-copilot-cli"
      - "/agent-governance-claude-code"
      - "/agent-governance-typescript"
      - "/agent-governance-antigravity-cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      javascript-dev-tooling:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
          - "typescript"
          - "@types/node"
          - "vitest"
          - "@vitest/*"
          - "browserslist"
        update-types:
          - "minor"
          - "patch"
      shared-npm-dependencies:
        group-by: "dependency-name"
        update-types:
          - "minor"
          - "patch"

  # .NET
  - package-ecosystem: "nuget"
    directory: "/agent-governance-dotnet"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # nuget does not auto-apply the repo's conventional-commit prefix, so the
    # generated PR title ("Bump X from A to B") fails the pr-title check. Set
    # it explicitly so nuget bumps match the required title format.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Rust
  - package-ecosystem: "cargo"
    directory: "/agent-governance-rust"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Go
  - package-ecosystem: "gomod"
    directory: "/agent-governance-golang"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/agent-governance-python/agent-os"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # codeql-action's init, autobuild and analyze steps must run the same
      # version: init writes a config stamped with its version and analyze
      # refuses to load a config from a different one ("Loaded a configuration
      # file for version X, but running version Y"). Bumping them in separate
      # PRs leaves every one of them red, so they are grouped into a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    cooldown:
      default-days: 7
