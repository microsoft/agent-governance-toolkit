[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cedarling_acs"
version = "5.0.0"
description = "Cedarling policy dispatcher for the Agent Governance Toolkit ACS v5 runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "Microsoft Corporation", email = "agentgovtoolkit@microsoft.com" }
]
keywords = ["agents", "governance", "cedar", "cedarling", "authorization", "acs", "agentmesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
cedarling = ["cedarling-python>=2.3,<3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23,<2.0"]

[project.urls]
Homepage = "https://github.com/microsoft/agent-governance-toolkit"
Repository = "https://github.com/microsoft/agent-governance-toolkit"
Documentation = "https://github.com/microsoft/agent-governance-toolkit/blob/main/docs/tutorials/28-build-custom-integration.md"

[tool.hatch.build.targets.wheel]
packages = ["cedarling_acs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
