[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmesh_agent365"
version = "5.0.0"
description = "Microsoft Agent 365 bridge for the Agent Governance Toolkit: observability, Copilot Studio threat detection, Purview and Entra Agent ID sync"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "Microsoft Corporation", email = "agentgovtoolkit@microsoft.com" }
]
keywords = ["agents", "governance", "agent365", "copilot-studio", "purview", "entra", "opentelemetry", "agentmesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25,<2.0"]
server = ["fastapi>=0.110,<1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<2.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "fastapi>=0.110,<1.0",
]

[project.urls]
Homepage = "https://github.com/microsoft/agent-governance-toolkit"
Repository = "https://github.com/microsoft/agent-governance-toolkit"
Documentation = "https://github.com/microsoft/agent-governance-toolkit/blob/main/docs/a365-agt-reference-architecture.md"

[tool.hatch.build.targets.wheel]
packages = ["agentmesh_agent365"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
