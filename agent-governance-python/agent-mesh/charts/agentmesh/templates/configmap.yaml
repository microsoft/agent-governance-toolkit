apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentmesh.fullname" . }}-config
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
data:
  default-policy.yaml: |
    # Default AgentMesh policy. The policy server consumes the flat
    # governance.toolkit/v1 schema, not a Kubernetes-style wrapper.
    # Deny by default until an operator adds explicit allow rules.
    apiVersion: governance.toolkit/v1
    name: default
    agents: ["*"]
    default_action: deny
    rules: []
