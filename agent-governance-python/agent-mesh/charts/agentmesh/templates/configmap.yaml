apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentmesh.fullname" . }}-config
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
data:
  default-policy.yaml: |
    # Default AgentMesh governance policy.
    # Must parse as the agent-mesh Python Policy schema (policy.py): a flat
    # document with name / default_action / rules, not a k8s-style
    # kind+apiVersion+spec wrapper (which the loader rejects). Ships fail-closed
    # (deny by default, no rules) so an operator layers their own allow rules.
    name: default
    default_action: deny
    rules: []
