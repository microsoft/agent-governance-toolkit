[build-system]
requires = ["setuptools>=83.0.0,<84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-studio"
version = "5.0.0"
description = "Public Preview — AGT Studio, the unified UI for the Agent Governance Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Microsoft Corporation", email = "agentgovtoolkit@microsoft.com"},
]
dependencies = [
    "agent-governance-toolkit-core>=5.0.0,<5.1.0",
    "agent-governance-toolkit-compliance>=5.0.0,<5.1.0",
    "agent-control-specification>=0.4.0b0,<0.5.0",
    "click>=8.4.2,<8.5.0",
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.4,<0.53.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.entry-points."agt.commands"]
serve = "agent_governance_studio.cli:serve"

[project.urls]
Homepage = "https://github.com/microsoft/agent-governance-toolkit"
Repository = "https://github.com/microsoft/agent-governance-toolkit"
"Bug Tracker" = "https://github.com/microsoft/agent-governance-toolkit/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_governance_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
