[package]
name = "agent_control_specification_annotators"
version = "0.4.0-beta.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Reference annotator dispatchers backed by Agent Control Specification"

[features]
default = []
aacs = ["agent-control-spec/aacs"]
openai_moderation = ["agent-control-spec/openai_moderation"]
perspective = ["agent-control-spec/perspective"]
llama_guard = ["agent-control-spec/llama_guard"]
lakera_guard = ["agent-control-spec/lakera_guard"]
auto = ["agent-control-spec/auto"]

[dependencies]
agent_control_specification = { path = "../../sdk/rust" }
agent-control-spec = { version = "=0.4.0-alpha.1", features = ["default-dispatchers"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[example]]
name = "live_aacs_classifier"
required-features = ["aacs"]

[[example]]
name = "live_enforce_loop"
required-features = ["aacs"]
