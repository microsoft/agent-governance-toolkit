[package]
name = "agent_control_specification_core"
version = "0.3.1-beta.0"
edition = "2021"
rust-version = "1.85"
description = "Deprecated compatibility shim over agent-control-spec. Use agent-control-spec directly."
license = "MIT"
readme = "../README.md"
keywords = ["agents", "policy", "security", "runtime"]
categories = ["config"]

[lib]
crate-type = ["lib"]

[features]
# Forwarded to agent-control-spec so existing feature selections keep
# resolving. The default surface stays the historical core plus the
# bundled OPA Rego dispatcher and the Cedar dispatcher.
#
# SECURITY: the bundled dispatcher features below reach host environment
# credentials. AGT gated that on manifest provenance through an
# `url_sourced` flag, so a manifest fetched over the network could not
# read host credentials. agent-control-spec 0.4.0-alpha.1 does not carry
# that gate while it still supports URL sourced `extends`. Treat these
# features as blocked pending an upstream fix. See docs/acs-retarget.md.
default = ["opa", "cedar"]
opa = ["agent-control-spec/opa"]
cedar = ["agent-control-spec/cedar"]
default-dispatchers = ["agent-control-spec/default-dispatchers"]
aacs = ["agent-control-spec/aacs"]
openai_moderation = ["agent-control-spec/openai_moderation"]
perspective = ["agent-control-spec/perspective"]
llama_guard = ["agent-control-spec/llama_guard"]
lakera_guard = ["agent-control-spec/lakera_guard"]
auto = ["agent-control-spec/auto"]

[dependencies]
agent-control-spec = { version = "=0.4.0-alpha.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The final serde_yaml release carries build metadata in its version, so
# "=0.9.34" names nothing on crates.io and the cooling-off scanner cannot
# resolve it. Cargo ignores the metadata when matching and says so on every
# build; the pin is exact either way.
serde_yaml = "=0.9.34+deprecated"
sha2 = "=0.10.9"
jsonschema = { version = "=0.17.1", default-features = false }
