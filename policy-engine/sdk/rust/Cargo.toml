[package]
name = "agent_control_specification"
version = "0.4.0-beta.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Rust SDK for the Agent Control Specification runtime."
readme = "../../README.md"

[features]
# Bundled annotators remain opt-in even though alpha.4 restores URL provenance
# checks. Local manifests and custom dispatchers remain trusted inputs. OPA
# executable and bundle behavior remain explicit host choices.
default = []
opa = ["agent_control_specification_core/opa"]
bundled-dispatchers = [
    "agent-control-spec/aacs",
    "agent-control-spec/openai_moderation",
    "agent-control-spec/perspective",
    "agent-control-spec/llama_guard",
    "agent-control-spec/lakera_guard",
    "agent-control-spec/auto",
]

[lib]
# `cdylib` for the C ABI the .NET SDK loads; `lib` so the Rust crates in this
# workspace keep linking against it normally.
crate-type = ["lib", "cdylib"]

[dependencies]
agent-control-spec = { version = "=0.4.0-alpha.4", default-features = false, features = ["opa", "cedar", "default-dispatchers"] }
agent-hooks-sdk = "=0.1.0-alpha.5"
# Carries the AGT-only artifact validation the C ABI exposes.
agent_control_specification_core = { version = "=0.3.2-beta.0", path = "../../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
# Same parser the upstream loader canonicalizes fetch targets with; the
# SSRF guard in `host::manifest_from_url` evaluates `Url::host()`.
url = "=2.5.8"

[dev-dependencies]
# Used by the conformance corpus runner to validate case files.
jsonschema = { version = "=0.17.1", default-features = false }

# Imports `agent_control_specification_core::validate_acs_artifacts`, which
# core gates behind its `opa` feature. Without this entry
# `cargo test -p agent_control_specification` (default features) fails to
# compile; the workspace build only passed because sibling members unify
# `core/opa` in.
[[test]]
name = "artifact_validation"
required-features = ["opa"]

[[test]]
name = "ffi_default_dispatchers"
required-features = ["bundled-dispatchers", "opa"]

[[example]]
name = "basic_host"
path = "../../examples/basic_host.rs"

[[example]]
name = "ifc_agent"
path = "../../examples/ifc_agent/demo.rs"
