[package]
name = "agent_control_specification_py"
version = "0.4.0-beta.0"
edition = "2021"
license = "MIT"
description = "Python native bindings for the Agent Control Specification runtime."
publish = false

[features]
default = []
bundled-dispatchers = ["agent_control_specification/bundled-dispatchers"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Both bindings call the OPA-backed artifact validation. Enabling `opa` on
# the SDK (which forwards to core) rather than only on core keeps the
# SDK's `required-features = ["opa"]` test target in the workspace run.
agent_control_specification = { path = "../rust", features = ["opa"] }
agent_control_specification_core = { path = "../../core", default-features = false, features = ["opa"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29"
