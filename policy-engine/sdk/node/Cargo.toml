[package]
name = "agent-control-specification-node"
version = "0.4.0-beta.0"
edition = "2021"
rust-version = "1.85"
description = "Node.js napi-rs bindings for Agent Control Specification core"
license = "MIT"
publish = false

[features]
default = []
bundled-dispatchers = ["agent_control_specification/bundled-dispatchers"]

[lib]
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
agent_control_specification = { path = "../rust" }
agent_control_specification_core = { path = "../../core", default-features = false, features = ["opa"] }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
napi-build = "2"
